num_train_frames: 2100000 # default 2100000
nstep_alpha_temp: 1000000
discount_alpha_temp: 500000
discount_beta_temp: 1600000
stddev_schedule: 'linear(1.0,0.1,500000)'
# Discount schedule inherited from the DrM MetaWorld configuration:
#   gamma(t) = discount
#              - discount_alpha * exp(-t / discount_alpha_temp)
#              - discount_beta * exp(-t / discount_beta_temp)
# It was intended to increase from 0.97 at t=0 toward 0.997 asymptotically.
# This schedule is not applied by the current training path: ReplayBuffer is
# initialized once with 0.997 - 0.02 - 0.007 = 0.97, so the critic uses a
# fixed per-transition discount of 0.97.
discount: 0.997
discount_alpha: 0.02
discount_beta: 0.007
nstep: 3
nstep_alpha: 7
reward_type: sparse

shaped_reward:
  enabled: false
  type: pbrs
  frame_history_stride: 4
  enable_ood_filter: false
  ood_filter_max_gap: null
  ood_filter_min_ood_run: null
  sparse_scale: 1.0
  pbrs_gamma: 0.97
  pbrs_dense_scale: 1.0
  pbrs_zero_next_potential_on_episode_end: false # for DrM in MetaWorld, this should be false
  pbrs_progress_bias_enabled: false
  pbrs_progress_bias_b: 0.0
  pbrs_progress_exp_enabled: false
  pbrs_progress_exp_base: 32.0
  posterior_temperature: 1.0e4
  ood_p_value_threshold: null
  checkpoint_path: null
  gaussian_model_h5_path: null
  calibration_h5_path: null
  reward_camera: corner2
  # Match these to the -r, --center-crop, and --crop-offset values used to
  # generate the reward-model data. crop_size is (height, width); crop_offset
  # is (left, top). Leave crop_size/offset null when no crop was used.
  reward_render_size: 448
  reward_crop_size: [224, 224]
  reward_crop_offset: [56, 112]
