defaults:
  - metaworld
  - _self_

task_name: coffee-push

discount: 0.995
discount_alpha: 0
discount_beta: 0
nstep: 3
nstep_alpha: 0

shaped_reward:
  enabled: true
  type: pbrs
  frame_history_stride: 4

  enable_ood_filter: false
  ood_filter_max_gap: 5
  ood_filter_min_ood_run: 10

  sparse_scale: 1.0
  pbrs_gamma: 0.995
  pbrs_dense_scale: 1.0

  pbrs_progress_bias_enabled: false
  pbrs_progress_bias_b: 0.0

  pbrs_progress_exp_enabled: false
  pbrs_progress_exp_base: 32.0

  posterior_temperature: 1.0e4
  ood_p_value_threshold: 0.1
  checkpoint_path: shaped_reward/assets/coffee-push/encoder_epoch020000.pt
  gaussian_model_h5_path: shaped_reward/assets/coffee-push/gaussian_progress_model.h5
  calibration_h5_path: shaped_reward/assets/coffee-push/calibration_embeddings.h5
  reward_camera: corner2
  reward_render_size: 448
  reward_crop_size: [224, 224]
  reward_crop_offset: [56, 112]
