name: drm-cu128
channels:
  - defaults
dependencies:
  - python=3.9.25
  - pip=26.0.1
  # Gym and the bundled MetaWorld code are incompatible with NumPy 2.x.
  - numpy=1.26.4
  - pip:
      # PyTorch CUDA 12.8 wheels are hosted on the PyTorch package index.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0+cu128
      - torchvision==0.23.0+cu128
      - torchaudio==2.8.0+cu128
      - absl-py==2.3.1
      - dm-env==1.6
      - flatten-dict==0.4.2
      - free-mujoco-py==2.1.6
      - gym==0.26.2
      - h5py==3.14.0
      - hydra-core==1.1.0
      - hydra-submitit-launcher==1.1.5
      - imageio==2.37.2
      - imageio-ffmpeg==0.4.4
      - opencv-python==4.11.0.86
      - pytest==8.4.2
      - pyyaml==6.0.3
      - scipy==1.13.1
      - tensorboard==2.17.1
      - termcolor==3.1.0
      - tqdm==4.70.0
      - wandb==0.15.1
